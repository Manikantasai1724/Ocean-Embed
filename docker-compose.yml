services:
  oceanembed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oceanembed_app
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./logs:/app/logs
      - ./checkpoints:/app/checkpoints
    environment:
      - PYTHONPATH=/app/src:/app
    ports:
      - "8000:8000"
    command: python -m unittest discover -s tests

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oceanembed_api
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./checkpoints:/app/checkpoints
    environment:
      - PYTHONPATH=/app/src:/app
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: oceanembed_dashboard
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

  train:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oceanembed_train
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./checkpoints:/app/checkpoints
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app/src:/app
    command: python -m oceanembed.train.train_attention
