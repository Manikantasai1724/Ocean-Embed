[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanembed"
version = "0.1.0"
description = "Satellite Embedding-Based Deep Learning Framework for Subsurface Ocean Temperature Reconstruction"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "OceanEmbed Team" }
]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0,<2.0.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "xarray>=2024.1.0",
    "netCDF4>=1.6.5",
    "dask>=2024.1.0",
    "zarr>=2.17.0,<3.0.0",
    "scikit-learn>=1.4.0",
    "copernicusmarine>=1.3.0",
    "earthaccess>=0.10.0",
    "matplotlib>=3.8.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

